name: Normalizar fotos Frutas Sorli
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalizar-fotos-sorli.yml']
permissions:
  contents: write
jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convertir fotos
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          names = ["oronules-2a-1-225x300.jpeg","oronules-cat-1-1-225x300.jpeg","citricos-ok-300x185.jpeg","aguacate3-225x300.jpeg","Diseno-sin-titulo-2023-10-03T184108.038-300x300.png","CESTA-7-191026--300x225.jpeg","CESTA-7-191026--300x225.jpeg","caja-neus-300x198.jpeg","caja-tomates-300x179.jpeg","caja-tomates-300x179.jpeg","caja-ensalada-300x232.jpeg","caja-basicos-300x225.jpeg","pack-halloween-300x225.jpeg","caja-soltero-a-1111-300x240.png"]
          for i, name in enumerate(names, 10044):
              src = Path('sabore-fotos/sorli') / name
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert('RGBA')
                  bg = Image.new('RGB', im.size, 'white')
                  bg.paste(im, mask=im.getchannel('A'))
                  bg = ImageOps.contain(bg, (800, 800), Image.Resampling.LANCZOS)
                  if max(bg.size) < 800:
                      s = 800 / max(bg.size)
                      bg = bg.resize(tuple(round(x*s) for x in bg.size), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (800,800), 'white')
                  canvas.paste(bg, ((800-bg.width)//2,(800-bg.height)//2))
                  out = Path('sabore-fotos') / f'sorli-{i}.jpg'
                  canvas.save(out, 'JPEG', quality=90, progressive=False, optimize=True)
                  with Image.open(out) as check:
                      assert check.format == 'JPEG' and check.mode == 'RGB' and check.size == (800,800)
                      check.verify()
          PY
      - name: Publicar fotos normalizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabore-fotos/sorli-*.jpg
          git diff --cached --quiet || git commit -m 'Normalizar fotos Sorli a JPEG RGB'
          git push
