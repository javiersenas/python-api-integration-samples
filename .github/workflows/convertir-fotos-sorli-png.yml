name: Convertir fotos Sorli a PNG
on:
  push:
    branches: [main]
    paths: ['.github/workflows/convertir-fotos-sorli-png.yml']
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convertir y validar PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for i in range(10044,10058):
              src=Path('sabore-fotos') / f'sorli-{i}.jpg'
              dst=src.with_suffix('.png')
              with Image.open(src) as im:
                  im.convert('RGB').save(dst, 'PNG', optimize=True)
              with Image.open(dst) as check:
                  assert check.format == 'PNG' and check.size == (800,800) and check.mode == 'RGB'
                  check.verify()
          PY
      - name: Publicar PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabore-fotos/sorli-*.png
          git diff --cached --quiet || git commit -m 'Publicar fotografías Sorli en PNG'
          git push
